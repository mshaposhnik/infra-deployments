apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    build.appstudio.redhat.com/multi-platform-config: hosts
  name: host-config
  namespace: multi-platform-controller
data:
  local-platforms: "\
    {{ join ",\\\n    " (.Values.localPlatforms | default (list "linux/x86_64" "local" "localhost")) }}\
  "


  {{- $outs := list }}
  {{- range $k, $v := .Values.dynamicConfigs }}
    {{- $parts := splitList "-" $k }}
    {{- $last := index $parts (sub (len $parts) 1) }}
    {{- $prefix := join "-" (slice $parts 0 (sub (len $parts) 1)) }}
    {{- $outs = append $outs (printf "%s/%s" $prefix $last) }}
  {{- end }}
  dynamic-platforms: "\
    {{ join ",\\\n    " $outs }}\
  "

  {{- if .Values.dynamicPoolPlatforms }}
  dynamic-pool-platforms: {{ .Values.dynamicPoolPlatforms }}
  {{- end }}

  instance-tag: {{ .Values.instanceTag | default "rhtap-prod" }}

  {{- $defaultTags := dict "Project" "Konflux" "Owner" "konflux-infra@redhat.com" "ManagedBy" "Konflux Infra Team" "app-code" "ASSH-001" "service-phase" "Production" "cost-center" "670" }}
  {{- $mergedTags := merge (.Values.additionalInstanceTags | default dict) $defaultTags }}

  additional-instance-tags: "\
  {{- $keys := keys $mergedTags | sortAlpha }}
  {{- range $i, $k := $keys }}
      {{ $k }}={{ index $mergedTags $k }}{{- if lt $i (sub (len $keys) 1) }},{{ end }}\
  {{- end }}
      "

  {{- $arm := (index .Values "archDefaults" "arm64") | default (dict) }}
  {{- $amd := (index .Values "archDefaults" "amd64") | default (dict) }}

  # cpu:memory (1:4)
  {{- with index .Values.dynamicConfigs "linux-arm64" }}
  dynamic.linux-arm64.type: {{ index . "type" | default "aws" | quote }}
  dynamic.linux-arm64.region: {{ index . "region" | default "us-east-1" | quote }}
  dynamic.linux-arm64.ami: {{ default (index $arm "ami") .ami | quote }}
  dynamic.linux-arm64.instance-type: {{ (index . "instance-type") | default "m6g.large" | quote }}
  dynamic.linux-arm64.instance-tag: {{ (index . "instance-tag") | quote }}
  dynamic.linux-arm64.key-name: {{ default (index $arm "key-name") ((index . "key-name")) | quote }}
  dynamic.linux-arm64.aws-secret: {{ (index . "aws-secret") | default "aws-account" | quote }}
  dynamic.linux-arm64.ssh-secret: {{ (index . "ssh-secret") | default "aws-ssh-key" | quote }}
  dynamic.linux-arm64.security-group-id: {{ default (index $arm "security-group-id") ((index . "security-group-id")) | quote }}
  dynamic.linux-arm64.max-instances: {{ (index . "max-instances") | default "250" | quote }}
  dynamic.linux-arm64.subnet-id: {{ default (index $arm "subnet-id") ((index . "subnet-id")) | quote }}
  dynamic.linux-arm64.allocation-timeout: "1200"
  {{ end }}


  {{- with index .Values.dynamicConfigs "linux-amd64" }}
